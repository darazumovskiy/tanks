# Drop-in к vector.service из пакета: /etc/systemd/system/vector.service.d/tanks.conf.
# Игра важнее сбора: при нехватке ядра процессор достаётся tanks (CPUWeight 100 против 20),
# при нехватке памяти система убивает Vector, а не игру.
[Service]
# Доступы попадают в конфиг через ${...} из /etc/default/vector; с 0.58 подстановку нужно включать явно.
Environment=VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
MemoryMax=150M
CPUWeight=20
Nice=5
Restart=always
RestartSec=5
